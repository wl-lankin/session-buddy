# Tests and lints on Windows and macOS, so the platform-specific code compiles on both.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The app crate needs dist/ and the relay binary (a bundle resource) to compile.
      # npm run build also runs tsc --noEmit.
      - name: Build the front end and the relay
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Front-end tests
        run: npx vitest run

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
