# Tests and lints on Windows and macOS, so the platform-specific code compiles on both.

name: CI

# Pushes to main and pull requests only: a branch with an open PR is checked once, not twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the run that is still going; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The app crate needs dist/ and the relay binary (a bundle resource) to compile.
      # npm run build also runs tsc --noEmit.
      - name: Build the front end and the relay
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Front-end tests
        run: npx vitest run

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
