# Builds the installers and the signed updater artifacts (latest.json, .sig files) and attaches
# them to a draft GitHub release. The installed apps see the update once the draft is published.
# The Windows binaries and installer are Authenticode-signed (docs/CODE-SIGNING.md).
# createUpdaterArtifacts lives in tauri.updater.conf.json, passed only here, because it makes
# `tauri build` demand the signing key and source builds have none.
# Push a tag like v1.0.0 (normal release) or v1.0.0-beta.1 (prerelease), or run it
# by hand with a tag name. The bundle version always comes from tauri.conf.json
# (NSIS needs a numeric version, so a beta tag still ships 1.0.0).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0 or v1.0.0-beta.1"
        required: true

permissions:
  contents: write
  id-token: write # Windows signing logs in to Azure Artifact Signing through OIDC

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--config src-tauri/tauri.updater.conf.json"
          - platform: macos-latest
            args: "--target universal-apple-darwin --config src-tauri/tauri.updater.conf.json --config src-tauri/tauri.universal.conf.json"
    runs-on: ${{ matrix.platform }}
    # The Azure login for signing only trusts jobs in this environment.
    environment: release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      # The app and the installer are signed inside tauri build, so the updater .sig files are
      # made over the signed installer. The relay is a bundle resource, which Tauri does not sign.
      - name: Prepare code signing (Windows)
        id: signing
        if: matrix.platform == 'windows-latest'
        uses: ./.github/actions/windows-signing
        with:
          description: Session Buddy

      - name: Build and sign the relay (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          cargo build --profile relay -p sb-relay
          pwsh -NoProfile -File .github/actions/windows-signing/sign.ps1 target/relay/sb-relay.exe

      # npm run build (the beforeBuildCommand) rebuilds target/relay/sb-relay for the
      # host only, so the universal relay lives in its own folder and an extra
      # config points the bundle at it.
      - name: Build the universal relay (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cargo build --profile relay -p sb-relay --target aarch64-apple-darwin
          cargo build --profile relay -p sb-relay --target x86_64-apple-darwin
          mkdir -p target/relay-universal
          lipo -create -output target/relay-universal/sb-relay \
            target/aarch64-apple-darwin/relay/sb-relay \
            target/x86_64-apple-darwin/relay/sb-relay
          lipo -info target/relay-universal/sb-relay
          cat > src-tauri/tauri.universal.conf.json <<'EOF'
          {"bundle": {"resources": {"../target/relay/sb-relay": null, "../target/relay-universal/sb-relay": "sb-relay"}}}
          EOF

      # The release body is the CHANGELOG.md section of this version, then a line "---" and the install
      # hints. It ends up in latest.json, so the app's update card shows what changed (up to the "---").
      - name: Release notes
        id: notes
        shell: bash
        run: |
          VERSION="${TAG#v}"
          VERSION="${VERSION%%-*}"
          CHANGES=$(awk -v v="$VERSION" '/^## /{p=($2==v)} p' CHANGELOG.md | sed '1d')
          if [ -z "$(echo "$CHANGES" | tr -d '[:space:]')" ]; then
            echo "::warning::No CHANGELOG.md section for $VERSION, the release notes will be generic"
            CHANGES="Version $VERSION."
          fi
          {
            echo 'body<<NOTES_EOF'
            echo "$CHANGES"
            echo
            echo '---'
            echo "$INSTALL_HINTS"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          INSTALL_HINTS: "The first install on a machine is manual. The Windows installer is code-signed (Wolfgang Linz); while the certificate is still new, SmartScreen can still ask once: More info > Run anyway. The macOS app is not signed yet: System Settings > Privacy & Security > Open Anyway after the first try, or run `xattr -dr com.apple.quarantine \"/Applications/Session Buddy.app\"`. Apps that already include the updater offer this version on the island and install it on one click (signature-checked)."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Session Buddy ${{ env.TAG }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          prerelease: ${{ contains(env.TAG, '-') }}
          args: ${{ matrix.args }}${{ steps.signing.outputs.config && format(' --config {0}', steps.signing.outputs.config) || '' }}
