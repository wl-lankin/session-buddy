[workspace]
members = ["common", "hook", "core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# The relay starts on every Claude Code event: optimise for size and start-up.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
