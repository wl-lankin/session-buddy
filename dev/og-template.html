<!doctype html><html><head><meta charset="utf-8">
<!-- OG-Bild für wolfgang-linz.de/session-buddy. Zum Rendern in den Ordner session-buddy/ der Website legen (nutzt ../fonts/fonts.css, sb.css, demo/ und assets/), warten, bis die Insel die Freigabe zeigt, und 1200 × 630 nach assets/og.png fotografieren. -->
<link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="sb.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#07080c}
.og{position:relative;width:1200px;height:630px;overflow:hidden;background:radial-gradient(120% 90% at 70% 10%,#10142a 0%,#07080c 60%)}

.copy{position:absolute;left:60px;top:196px;width:500px;z-index:2}
.wm{display:flex;align-items:center;gap:10px;font:600 20px var(--body);color:#f5f6f8;margin-bottom:22px}
.wm img{width:32px;height:32px}
h1{margin:0;font:700 54px/1 var(--body);letter-spacing:-.045em;color:#f5f6f8}
h1 em{display:block;font-size:1.12em;margin-top:4px}
p{margin:22px 0 0;font:400 19px/1.45 var(--body);color:#9398a1}
.chips{display:flex;gap:8px;margin-top:22px}
.chips span{font:500 14px var(--body);padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:#f5f6f8}
