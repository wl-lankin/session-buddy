[package]
name = "session-buddy"
description = "See and answer all your Claude Code sessions"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "session_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sb-common = { path = "../common" }
sb-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# The versions tauri already uses: only to switch off WebView2's browser accelerator keys.
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Wdk_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
